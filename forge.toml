# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.2.0"
repo = "client"
workers = "claude"
test = "[ ! -f package.json ] || (npm ci && npm test)"
checks = ["tests", "forge-pr-check"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "opus"
effort = "high"

[models.fix]
model = "opus"
effort = "high"

[models.lite]
model = "sonnet"
effort = "medium"

[models.grill.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.review]
model = "gpt-6.1-sol"
effort = "high"
